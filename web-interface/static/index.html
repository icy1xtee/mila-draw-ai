<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a4fd6">
  <title>Mila Draw AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237a4fd6'/%3E%3Cpath d='M9 22c3-9 6-13 14-14-4 4-6 8-7 14' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top hidden" id="top">
    <div class="top-inner">
      <a class="brand" href="#/">Mila Draw AI</a>
      <span class="comfy-off hidden" id="comfy-off">ComfyUI не отвечает</span>
    </div>
    <div class="queue hidden" id="queue">
      <div class="queue-inner">
        <div class="queue-line">
          <b id="queue-title"></b>
          <span class="queue-time" id="queue-time"></span>
          <button class="icon-btn" id="queue-cancel" title="Отменить">✕</button>
        </div>
        <div class="bar"><i id="queue-bar"></i></div>
        <div class="queue-more small muted" id="queue-more"></div>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <dialog class="viewer" id="viewer"></dialog>
  <dialog class="modal" id="settings"></dialog>
  <dialog class="modal" id="help"></dialog>
  <dialog class="modal" id="import"></dialog>
  <input type="file" id="file-picker" class="hidden" accept="image/*" multiple>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
