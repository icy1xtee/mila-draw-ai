description = "Local web interface for image generation on MSI (ComfyUI + Claude journal)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13",
    "python-multipart>=0.0.9",
    "pillow>=11",
]

[tool.uv]
package = false
